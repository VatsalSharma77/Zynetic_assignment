version: '3.8'

services:

  db:
    image: postgres:15
    container_name: energy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: energy_ingestion_db
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d

  app:
    build: .
    container_name: energy_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      PORT: 5000
      DB_USER: postgres
      DB_PASSWORD: Vatsal@10092001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: energy_ingestion_db
